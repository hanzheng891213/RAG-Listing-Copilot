name = "rag-listing-copilot"
main = "backend/src/worker.ts"
compatibility_date = "2025-06-11"
compatibility_flags = ["nodejs_compat"]

# The explicit binding is load-bearing: without it env.ASSETS is undefined, so
# the Worker's SPA fallback throws on any path that is not a real asset or an
# /api route — Cloudflare turns that into error 1101, i.e. HTTP 500.
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[build]
command = "npm run build"

[ai]
binding = "AI"

# Platform filtering happens in application code (a metadata index is not
# required). Keeping it that way avoids the silent "index missing => zero
# matches" failure mode that leaves generation without RAG grounding.
[[vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "knowledge-chunks-prod"

[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "rag-listing-copilot"
database_id = "2ab38a1a-72b5-4cc7-be75-eb1c07931ec6"
migrations_dir = "migrations"

# Secrets are NOT stored in this file. Set them once per environment:
#
#   npx wrangler secret put JWT_SECRET        # openssl rand -hex 32
#   npx wrangler secret put CONFIG_ENC_KEY    # openssl rand -base64 32
#   npx wrangler secret put ALLOWED_ORIGINS   # https://your-domain (optional)
#
# The Worker fails closed when JWT_SECRET is missing, and returns 503 when
# CONFIG_ENC_KEY is missing instead of silently storing keys in plaintext.
