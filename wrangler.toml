name = "rag-listing-copilot"
main = "backend/src/worker.ts"
compatibility_date = "2025-06-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

[build]
command = "npm run build"

[ai]
binding = "AI"

# Metadata filtering is a no-op until the property has a metadata index — a
# filter on an unindexed property silently matches zero vectors. After creating
# or recreating this index, run:
#   npx wrangler vectorize create-metadata-index knowledge-chunks-prod --property-name=platform --type=string
# Vectors upserted before the index existed stay unfilterable until re-upserted.
[[vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "knowledge-chunks-prod"

[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "rag-listing-copilot"
database_id = "2ab38a1a-72b5-4cc7-be75-eb1c07931ec6"
migrations_dir = "migrations"

[vars]
JWT_SECRET = "rag-copilot-jwt-secret-2026-dev"
