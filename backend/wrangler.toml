name = "rag-listing-copilot-api"
main = "src/worker.ts"
compatibility_date = "2025-06-11"
compatibility_flags = ["nodejs_compat"]

# ─── AI Bindings (Workers AI for embeddings) ─────────────────────────
[ai]
binding = "AI"

# ─── Vectorize Index (semantic search) ──────────────────────────────
[[vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "knowledge-chunks"

# ─── D1 Database (document metadata) ─────────────────────────────────
[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "rag-listing-copilot"
database_id = "2ab38a1a-72b5-4cc7-be75-eb1c07931ec6"
migrations_dir = "../migrations"

# ─── Production Environment ─────────────────────────────────────────
# Secrets are set with `wrangler secret put`, never stored in this file:
#   JWT_SECRET, CONFIG_ENC_KEY, ALLOWED_ORIGINS
# The Worker fails closed when JWT_SECRET / CONFIG_ENC_KEY are missing.
[env.production]

[env.production.ai]
binding = "AI"

# Retrieval filters platform in code, so no Vectorize metadata index is required.
[[env.production.vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "knowledge-chunks-prod"

[[env.production.d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "rag-listing-copilot"
database_id = "2ab38a1a-72b5-4cc7-be75-eb1c07931ec6"
migrations_dir = "../migrations"
